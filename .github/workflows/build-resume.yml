name: Build Resume

on:
  push:
    paths:
      - "src/resume.typ"
      - ".github/workflows/build-resume.yml"
  pull_request:
    paths:
      - "src/resume.typ"
      - ".github/workflows/build-resume.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.14.2"

      - name: Compile resume
        run: typst compile src/resume.typ resume.pdf --font-path fonts

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v6
        with:
          name: resume
          path: resume.pdf
